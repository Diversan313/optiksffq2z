name: OptikLink KeepAlive

on:
  schedule:
    - cron: '0 12 */2 * *' # Запуск каждые 2 дня в 12:00 UTC
  workflow_dispatch: # Возможность запустить вручную через кнопку

jobs:
  autologin:
    runs-on: ubuntu-latest
    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей и Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: Запуск авто-входа и авто-старта
        env:
          STATE_JSON_BASE64: ${{ secrets.STATE_JSON_BASE64 }}
          PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
        run: python autologin.py
