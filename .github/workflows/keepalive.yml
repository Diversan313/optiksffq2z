name: OptikLink KeepAlive

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  autologin:
    runs-on: ubuntu-latest
    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей и Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: Запуск авто-входа и авто-старта
        env:
          STATE_JSON_BASE64: ${{ secrets.STATE_JSON_BASE64 }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
        run: python autologin.py

      - name: Сохранение скриншотов при ошибке
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: "*.png"
